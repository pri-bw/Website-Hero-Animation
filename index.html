<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faros · Lighthouse Hero by Blurry Works</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <section class="hero">
      <div id="lighthouse-scene" aria-hidden="true">
        <div data-service-labels>
          <div data-service-label="IP"><span class="service-label-text">IP</span></div>
          <div data-service-label="Regulatory"><span class="service-label-text">Regulatory</span></div>
          <div data-service-label="Incorporation"><span class="service-label-text">Incorporation</span></div>
          <div data-service-label="Scientifics"><span class="service-label-text">Scientifics</span></div>
          <div data-service-label="Product Fit"><span class="service-label-text">Product Fit</span></div>
          <div data-service-label="Marketing"><span class="service-label-text">Marketing</span></div>
          <div data-service-label="Commercialisation"><span class="service-label-text">Commercialisation</span></div>
          <div data-service-label="Insurance"><span class="service-label-text">Insurance</span></div>
          <div data-service-label="Funding"><span class="service-label-text">Funding</span></div>
        </div>
      </div>
    </section>
    <script type="module" src="main.js"></script>
  </body>
</html>
